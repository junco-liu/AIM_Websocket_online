<!DOCTYPE html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIM 控制台</title>
<meta name="description" content="浏览器直连 VEX AIM 机器人的局域网控制台，无需服务器。">

<style>
:root {
  --bg:        #0c0e11;
  --surface:   #14171c;
  --raised:    #1b1f26;
  --line:      #262b34;
  --line-soft: #1e222a;

  --text:      #e7eaef;
  --text-dim:  #aab2c0;
  --text-mute: #868f9e;

  --sig:       #3fd8a4;   /* connected · primary · focus */
  --sig-dim:   #1f6b53;
  --sig-glow:  #3fd8a433;
  --danger:    #ff6b5e;
  --danger-dim:#5c2621;

  --r-sm: 6px;
  --r-md: 9px;
  --r-lg: 14px;

  --s1: 4px;  --s2: 8px;  --s3: 12px; --s4: 16px;
  --s5: 20px; --s6: 24px; --s8: 32px;

  --tap: 46px;
  --ease: cubic-bezier(.2,.8,.3,1);
  --fast: 140ms var(--ease);

  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", Roboto, sans-serif;
}

@media (max-width: 899px) {
  :root { --tap: 56px; }
  header { row-gap: var(--s2); padding: var(--s3) var(--s4); }
  .brand { order: 1; }
  .status { order: 2; }
  .field { order: 3; width: 100%; }
  .field #ip { flex: 1; width: auto; }
  body.live .field { width: auto; }
  /* driving is the frequent task on a phone — put the pad in thumb reach */
  .rail .group:nth-of-type(2) { order: -1; }
  .group { padding: var(--s4); }
}

* { box-sizing: border-box; }

html { color-scheme: dark; }

body {
  margin: 0;
  min-height: 100dvh;
  display: grid;
  grid-template-rows: auto 1fr;
  background: var(--bg);
  color: var(--text);
  font: 400 13.5px/1.5 var(--font);
  -webkit-font-smoothing: antialiased;
  caret-color: var(--sig);
  overscroll-behavior: none;
}

::selection { background: var(--sig-dim); color: #fff; }

:focus-visible {
  outline: 2px solid var(--sig);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

* { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-thumb {
  background: var(--line); border-radius: 99px;
  border: 3px solid transparent; background-clip: content-box;
}
*::-webkit-scrollbar-thumb:hover { background: #333a45; background-clip: content-box; }

/* ── header ─────────────────────────────────────────────── */

header {
  display: flex; align-items: center; gap: var(--s3);
  padding: var(--s3) var(--s5);
  border-bottom: 1px solid var(--line);
  background: var(--surface);
  flex-wrap: wrap;
}

.brand {
  display: flex; align-items: baseline; gap: var(--s2);
  font-size: 15px; font-weight: 620; letter-spacing: -.015em; margin-right: var(--s2);
}
.brand small {
  font-weight: 450; font-size: 11px; color: var(--text-mute);
  letter-spacing: .04em; text-transform: uppercase;
}

.field { display: flex; align-items: center; gap: var(--s2); }
body.live #ip, body.live #connect { display: none; }

.host {
  display: none; align-items: center; gap: 7px;
  height: 36px; padding: 0 var(--s3);
  font-size: 13.5px; font-variant-numeric: tabular-nums; color: var(--text-dim);
  background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-md);
}
body.live .host { display: inline-flex; }
.host b { color: var(--text); font-weight: 560; }

input[type=text] {
  width: 148px; height: 36px;
  padding: 0 var(--s3);
  font: 400 13.5px/1 var(--font);
  font-variant-numeric: tabular-nums;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  transition: border-color var(--fast);
}
input[type=text]:hover:not(:disabled) { border-color: #333a45; }
input[type=text]:focus { outline: none; border-color: var(--sig); box-shadow: 0 0 0 3px var(--sig-glow); }
input[type=text]:disabled { color: var(--text-mute); background: var(--surface); }
input::placeholder { color: var(--text-mute); }

.status {
  margin-left: auto;
  display: flex; align-items: center; gap: var(--s4);
  font-variant-numeric: tabular-nums;
  color: var(--text-dim); font-size: 13.5px;
}
.status b { color: var(--text); font-weight: 560; }
.status .metric { display: none; gap: 6px; align-items: baseline; }
body.live .status .metric { display: flex; }

.state { display: flex; align-items: center; gap: var(--s2); font-size: 13.5px; }
.dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--text-mute);
  transition: background var(--fast), box-shadow var(--fast);
}
body.live .dot { background: var(--sig); box-shadow: 0 0 0 3px var(--sig-glow); }
body.busy .dot { background: #e0a340; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .25; } }

/* ── buttons ────────────────────────────────────────────── */

button {
  --btn-bg: var(--raised);
  --btn-fg: var(--text);
  --btn-line: var(--line);
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 36px; padding: 0 var(--s4);
  font: 500 13.5px/1 var(--font);
  color: var(--btn-fg);
  background: var(--btn-bg);
  border: 1px solid var(--btn-line);
  border-radius: var(--r-md);
  cursor: pointer;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
  transition: background var(--fast), border-color var(--fast),
              transform var(--fast), color var(--fast), opacity var(--fast);
}
button:hover:not(:disabled) { --btn-bg: #232833; --btn-line: #343b47; }
button:active:not(:disabled) { transform: translateY(1px); --btn-bg: #1a1e25; }
button:disabled { opacity: .38; cursor: not-allowed; }

button.primary { --btn-bg: var(--sig); --btn-fg: #06120d; --btn-line: transparent; font-weight: 600; }
button.primary:hover:not(:disabled) { --btn-bg: #55e6b4; --btn-line: transparent; }
button.primary:active:not(:disabled) { --btn-bg: #35c492; }

button.quiet { --btn-bg: transparent; --btn-fg: var(--text-dim); }
button.quiet:hover:not(:disabled) { --btn-fg: var(--text); --btn-bg: var(--raised); }

button.danger { --btn-fg: var(--danger); --btn-line: var(--danger-dim); }
button.danger:hover:not(:disabled) { --btn-bg: #2a1614; --btn-line: var(--danger); }

.icon { width: 17px; height: 17px; flex: none; stroke: currentColor;
        fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

/* ── main ───────────────────────────────────────────────── */

main {
  display: grid;
  grid-template-columns: minmax(0,1fr) 336px;
  min-height: 0;
}
@media (max-width: 899px) { main { grid-template-columns: 1fr; } }

/* ── stage (camera) ─────────────────────────────────────── */

.stage {
  position: relative;
  display: grid; place-items: center;
  min-height: 260px;
  padding: var(--s5);
  background:
    radial-gradient(120% 90% at 50% 0%, #12161b 0%, var(--bg) 70%);
}
@media (max-width: 899px) { .stage { padding: var(--s3); min-height: 40dvh; } }

.frame {
  position: relative;
  width: 100%; max-width: 780px; aspect-ratio: 4/3;
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  background: #000;
  overflow: hidden;
  box-shadow: 0 18px 44px -18px #000c, 0 2px 6px -2px #0008;
}
#view { width: 100%; height: 100%; object-fit: contain; display: block; }
body:not(.streaming) #view { display: none; }

.placeholder {
  position: absolute; inset: 0;
  display: grid; place-content: center; justify-items: center; gap: var(--s3);
  padding: var(--s6); text-align: center;
  color: var(--text-mute);
  background: repeating-linear-gradient(-45deg, #0e1114 0 12px, #0c0e11 12px 24px);
}
body.streaming .placeholder { display: none; }
.placeholder svg { width: 30px; height: 30px; stroke: currentColor; fill: none;
                   stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; opacity: .55; }
.placeholder p  { margin: 0; color: var(--text-dim); font-size: 15px; font-weight: 560; }
.placeholder p + p { color: var(--text-mute); font-size: 12.5px; font-weight: 400; max-width: 30ch; }

.live-badge {
  position: absolute; top: var(--s3); left: var(--s3);
  display: none; align-items: center; gap: 6px;
  padding: 4px 9px 4px 7px;
  font-size: 11px; font-weight: 600; letter-spacing: .06em;
  color: var(--sig);
  background: #0a0d0cd9; border: 1px solid var(--sig-dim);
  border-radius: 99px;
  backdrop-filter: blur(6px);
}
body.streaming .live-badge { display: inline-flex; }
.live-badge i { width: 6px; height: 6px; border-radius: 50%; background: var(--sig);
                animation: pulse 1.6s var(--ease) infinite; }
@keyframes pulse { 50% { opacity: .3; } }

/* ── rail (controls) ────────────────────────────────────── */

.rail {
  display: flex; flex-direction: column;
  border-left: 1px solid var(--line);
  background: var(--surface);
  overflow-y: auto;
}
@media (max-width: 899px) {
  .rail { border-left: 0; border-top: 1px solid var(--line); }
}

.group { padding: var(--s5); border-bottom: 1px solid var(--line-soft); }
.group:last-child { border-bottom: 0; }

.group > h2 {
  margin: 0 0 var(--s4);
  font-size: 11px; font-weight: 620; letter-spacing: .09em; text-transform: uppercase;
  color: var(--text-mute);
}

/* d-pad */

.pad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-areas: ".  up   ." "lf stop rt" "ccw dn cw";
  gap: var(--s2);
  max-width: 260px; margin-inline: auto;
}
.pad button { padding: 0; min-height: var(--tap); }
.pad .icon { width: 21px; height: 21px; }
[data-go="0"]   { grid-area: up;   }
[data-go="180"] { grid-area: dn;   }
[data-go="-90"] { grid-area: lf;   }
[data-go="90"]  { grid-area: rt;   }
[data-spin="-1"]{ grid-area: ccw;  }
[data-spin="1"] { grid-area: cw;   }
[data-halt]     { grid-area: stop; }

/* sliders */

.slider { display: grid; grid-template-columns: 1fr auto; gap: var(--s1) var(--s3);
          align-items: center; margin-top: var(--s4); }
.slider label { font-size: 12.5px; color: var(--text-dim); }
.slider output { font-size: 12.5px; color: var(--text); font-weight: 560;
                 font-variant-numeric: tabular-nums; }
.slider input { grid-column: 1 / -1; width: 100%; margin: 0; accent-color: var(--sig); height: 34px; }

/* lights */

.light-row { display: flex; gap: var(--s2); align-items: center; }
select {
  height: 36px; padding: 0 var(--s2); flex: 1; min-width: 0;
  font: 400 13.5px/1 var(--font); color: var(--text);
  background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-md);
}
input[type=color] {
  width: 36px; height: 36px; flex: none; padding: 3px;
  background: var(--raised); border: 1px solid var(--line);
  border-radius: var(--r-md); cursor: pointer;
}
input[type=color]::-webkit-color-swatch { border: 0; border-radius: 4px; }
input[type=color]::-moz-color-swatch { border: 0; border-radius: 4px; }

.pair { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); margin-top: var(--s2); }
.trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s2); }

/* log */

details.log { border-top: 1px solid var(--line-soft); margin-top: auto; }
details.log summary {
  padding: var(--s3) var(--s5); cursor: pointer; list-style: none;
  font-size: 12.5px; color: var(--text-mute);
  display: flex; align-items: center; gap: 6px;
  transition: color var(--fast);
}
details.log summary:hover { color: var(--text-dim); }
details.log summary::-webkit-details-marker { display: none; }
details.log summary .icon { width: 13px; height: 13px; transition: transform var(--fast); }
details.log[open] summary .icon { transform: rotate(90deg); }
#log {
  margin: 0; padding: 0 var(--s5) var(--s5);
  max-height: 168px; overflow: auto;
  font: 400 11.5px/1.65 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color: var(--text-mute); white-space: pre-wrap; word-break: break-all;
}
#log .err { color: var(--danger); }

/* alert strip */

.alert {
  display: none;
  gap: var(--s3); align-items: flex-start;
  padding: var(--s3) var(--s5);
  background: #241a0f; border-bottom: 1px solid #4a3418;
  color: #f0c98a; font-size: 13.5px; line-height: 1.55;
}
.alert.show { display: flex; }
.alert svg { width: 17px; height: 17px; flex: none; margin-top: 2px; stroke: currentColor;
             fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.alert b { color: #ffdca8; font-weight: 600; }
.alert ol { margin: var(--s2) 0 0; padding-left: 1.25em; }
.alert code { background: #00000040; padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }

@media (max-width: 899px) { .slider input { height: 44px; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>

    <g id="i-stop"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/></g>
    <g id="i-video"><rect x="2.5" y="6" width="13" height="12" rx="2.5"/><path d="m21.5 8.5-6 3.5 6 3.5z"/></g>
    <g id="i-video-off"><path d="M15.5 15.5V18a2.5 2.5 0 0 1-2.5 2.5H5A2.5 2.5 0 0 1 2.5 18V9.5"/>
      <path d="M6.5 6h6.5A2.5 2.5 0 0 1 15.5 8.5v1"/><path d="m21.5 8.5-6 3.5"/><path d="M3 3l18 18"/></g>

      <path d="M12 2.5a6 6 0 0 0-3.4 10.9c.5.4.9 1 .9 1.7v.4h5v-.4c0-.7.4-1.3.9-1.7A6 6 0 0 0 12 2.5z"/></g>

</svg>

<header>
  <span class="brand">AIM <small>控制台</small></span>

  <div class="field">
    <input type="text" id="ip" placeholder="192.168.4.1" value="192.168.4.1"
           inputmode="decimal" autocomplete="off" spellcheck="false" aria-label="机器人 IP 地址">
    <button class="primary" id="connect">
      <svg class="icon"><use href="#i-power"/></svg>连接
    </button>
    <span class="host">已连接 <b id="hostLabel"></b></span>
    <button class="quiet" id="disconnect" disabled>断开</button>
  </div>

  <div class="status">
    <span class="metric">电量 <b id="battery">—</b></span>
    <span class="metric">朝向 <b id="heading">—</b></span>
    <span class="state"><span class="dot"></span><span id="stateText">未连接</span></span>
  </div>
</header>

<div class="alert" id="alert" role="alert">
  <svg><use href="#i-warn"/></svg>
  <div>
    <b>当前是 HTTPS 页面，浏览器会拦截到机器人的明文连接。</b>
    <ol>
      <li>点击地址栏左侧的图标 → <code>网站设置</code></li>
      <li>找到 <code>不安全内容</code>，改为 <code>允许</code></li>
      <li>刷新本页</li>
    </ol>
  </div>
</div>

<main>
  <section class="stage">
    <div class="frame">
      <img id="view" alt="机器人摄像头实时画面">
      <span class="live-badge"><i></i>LIVE</span>
      <div class="placeholder" id="placeholder">
        <svg><use href="#i-video-off"/></svg>
        <p id="phTitle">尚未连接机器人</p>
        <p id="phHint">确认设备与机器人在同一局域网，输入 IP 后点击「连接」。</p>
      </div>
    </div>
  </section>

  <aside class="rail">
    <div class="group">
      <h2>画面</h2>
      <div class="pair">
        <button class="need" id="camOn" disabled><svg class="icon"><use href="#i-video"/></svg>开启</button>
        <button class="need" id="camOff" disabled><svg class="icon"><use href="#i-video-off"/></svg>关闭</button>
      </div>
    </div>

    <div class="group">
      <h2>移动 · WASD / QE / 空格急停</h2>
      <div class="pad">
        <button class="need" disabled data-go="0"    aria-label="前进"    ><svg class="icon"><use href="#i-arrow"/></svg></button>
        <button class="need" disabled data-go="-90"  aria-label="左平移"  ><svg class="icon" style="transform:rotate(-90deg)"><use href="#i-arrow"/></svg></button>
        <button class="need danger" disabled data-halt aria-label="急停"  ><svg class="icon"><use href="#i-stop"/></svg></button>
        <button class="need" disabled data-go="90"   aria-label="右平移"  ><svg class="icon" style="transform:rotate(90deg)"><use href="#i-arrow"/></svg></button>
        <button class="need" disabled data-spin="-1" aria-label="左转"    ><svg class="icon"><use href="#i-ccw"/></svg></button>
        <button class="need" disabled data-go="180"  aria-label="后退"    ><svg class="icon" style="transform:rotate(180deg)"><use href="#i-arrow"/></svg></button>
        <button class="need" disabled data-spin="1"  aria-label="右转"    ><svg class="icon"><use href="#i-cw"/></svg></button>
      </div>

      <div class="slider">
        <label for="speed">移动速度</label><output id="speedv">120 mm/s</output>
        <input type="range" id="speed" min="20" max="200" step="10" value="120">
      </div>
      <div class="slider">
        <label for="turn">转向速度</label><output id="turnv">120 °/s</output>
        <input type="range" id="turn" min="20" max="180" step="10" value="120">
      </div>
    </div>

    <div class="group">
      <h2>灯光</h2>
      <div class="light-row">
        <select id="led" aria-label="选择灯珠">
          <option value="all">全部灯珠</option>
          <option value="light1">灯珠 1</option><option value="light2">灯珠 2</option>
          <option value="light3">灯珠 3</option><option value="light4">灯珠 4</option>
          <option value="light5">灯珠 5</option><option value="light6">灯珠 6</option>
        </select>
        <input type="color" id="color" value="#3fd8a4" aria-label="灯光颜色">
      </div>
      <div class="pair">
        <button class="need" id="ledOn" disabled><svg class="icon"><use href="#i-bulb"/></svg>点亮</button>
        <button class="need" id="ledOff" disabled>熄灭</button>
      </div>
    </div>

    <div class="group">
      <h2>踢球</h2>
      <div class="trio">
        <button class="need" disabled data-cmd="kick_soft">轻</button>
        <button class="need" disabled data-cmd="kick_medium">中</button>
        <button class="need" disabled data-cmd="kick_hard"><svg class="icon"><use href="#i-zap"/></svg>重</button>
      </div>
    </div>

    <details class="log">
      <summary><svg class="icon"><use href="#i-chevron"/></svg>活动日志</summary>
      <pre id="log"></pre>
    </details>
  </aside>
</main>

<script>
const $ = id => document.getElementById(id);
const body = document.body;

function log(msg, isErr) {
  const el = document.createElement(isErr ? 'span' : 'span');
  if (isErr) el.className = 'err';
  el.textContent = msg + '\n';
  $('log').append(el);
  $('log').scrollTop = 1e9;
  if (isErr) $('log').closest('details').open = true;
}

function placeholder(title, hint) { $('phTitle').textContent = title; $('phHint').textContent = hint; }

let cmdWs, imgWs, statusWs, lastUrl, statusTimer;
const pending = [];   // ws_cmd is strictly request/response — replies arrive in send order

function send(obj) {
  if (cmdWs?.readyState !== 1) return Promise.reject(new Error('未连接'));
  return new Promise((res, rej) => {
    pending.push({ res, rej });
    cmdWs.send(new TextEncoder().encode(JSON.stringify(obj)));
  });
}

function setState(cls, text) {
  body.classList.remove('live', 'busy');
  if (cls) body.classList.add(cls);
  $('stateText').textContent = text;
  const live = cls === 'live';
  $('ip').disabled = $('connect').disabled = live || cls === 'busy';
  $('disconnect').disabled = !live && cls !== 'busy';
  document.querySelectorAll('.need').forEach(b => b.disabled = !live);
}

function connect() {
  const host = $('ip').value.trim();
  if (!host) { log('请输入机器人 IP 地址', true); $('ip').focus(); return; }

  setState('busy', '连接中…');
  placeholder('正在连接…', `尝试 ws://${host}`);
  log(`连接 ${host}`);

  cmdWs = new WebSocket(`ws://${host}/ws_cmd`);
  cmdWs.binaryType = 'arraybuffer';

  cmdWs.onmessage = e => {
    const p = pending.shift();
    if (!p) return;
    const r = JSON.parse(new TextDecoder().decode(e.data));
    if (r.status === 'error') { log(`命令 ${r.cmd_id} 失败: ${r.error_info ?? '未知错误'}`, true); p.rej(r); }
    else p.res(r);
  };

  cmdWs.onopen = async () => {
    $('hostLabel').textContent = host;
    setState('live', '已连接');
    placeholder('画面未开启', '点击右侧「开启」查看机器人摄像头实时画面。');
    log('已连接，初始化程序');
    await send({ cmd_id: 'program_init' }).catch(() => {});
    openStatus(host);
  };

  cmdWs.onerror = () => log(
    `无法连接 ${host} —— 检查 IP 是否正确、设备是否与机器人在同一局域网` +
    (location.protocol === 'https:' ? '，以及本页的「不安全内容」是否已允许' : ''), true);

  cmdWs.onclose = () => {
    pending.splice(0).forEach(p => p.rej(new Error('连接已关闭')));
    teardown();
    setState(null, '未连接');
    placeholder('尚未连接机器人', '确认设备与机器人在同一局域网，输入 IP 后点击「连接」。');
    log('已断开');
  };

  imgWs = new WebSocket(`ws://${host}/ws_img`);
  imgWs.binaryType = 'blob';
  imgWs.onmessage = e => {
    const url = URL.createObjectURL(e.data);
    $('view').src = url;
    if (lastUrl) URL.revokeObjectURL(lastUrl);
    lastUrl = url;
    body.classList.add('streaming');
  };
  imgWs.onclose = () => body.classList.remove('streaming');
}

// the status socket answers only when polled
function openStatus(host) {
  statusWs = new WebSocket(`ws://${host}/ws_status`);
  statusWs.binaryType = 'arraybuffer';
  statusWs.onopen = () => statusTimer = setInterval(() => {
    if (statusWs.readyState === 1) statusWs.send(new Uint8Array([1]));
  }, 200);
  statusWs.onmessage = e => {
    const s = JSON.parse(new TextDecoder().decode(e.data)).robot;
    if (!s) return;
    $('battery').textContent = s.battery + '%';
    $('heading').textContent = Math.round(+s.heading) + '°';
  };
}

function teardown() {
  clearInterval(statusTimer);
  body.classList.remove('streaming');
  if (lastUrl) { URL.revokeObjectURL(lastUrl); lastUrl = null; }
  $('view').removeAttribute('src');
  $('battery').textContent = $('heading').textContent = '—';
}

function disconnect() { [cmdWs, imgWs, statusWs].forEach(w => w?.close()); }

/* ── commands ─────────────────────────────────────────── */

const drive = angle => send({ cmd_id: 'drive', angle, speed: +$('speed').value, stacking_type: 0 });
const spin  = dir   => send({ cmd_id: 'turn', turn_rate: dir * +$('turn').value, stacking_type: 0 });
const halt  = async () => {
  await send({ cmd_id: 'drive', angle: 0, speed: 0, stacking_type: 0 });
  await send({ cmd_id: 'turn', turn_rate: 0, stacking_type: 0 });
};
const quiet = p => p?.catch(() => {});

$('connect').onclick = connect;
$('disconnect').onclick = disconnect;
$('ip').onkeydown = e => { if (e.key === 'Enter') connect(); };  // no bare `&&` — a falsy return cancels the keypress

$('speed').oninput = e => $('speedv').textContent = e.target.value + ' mm/s';
$('turn').oninput  = e => $('turnv').textContent  = e.target.value + ' °/s';

$('camOn').onclick  = () => imgWs?.send(new Uint8Array([1]));
$('camOff').onclick = () => {
  imgWs?.send(new Uint8Array([0]));
  body.classList.remove('streaming');
  placeholder('画面已关闭', '点击「开启」恢复实时画面。');
};

$('ledOn').onclick = () => {
  const h = $('color').value;
  quiet(send({ cmd_id: 'light_set', [$('led').value]: {
    r: parseInt(h.slice(1, 3), 16), g: parseInt(h.slice(3, 5), 16), b: parseInt(h.slice(5, 7), 16) } }));
};
$('ledOff').onclick = () => quiet(send({ cmd_id: 'light_set', [$('led').value]: { r: 0, g: 0, b: 0 } }));

document.querySelectorAll('[data-cmd]').forEach(b =>
  b.onclick = () => quiet(send({ cmd_id: b.dataset.cmd })));

document.querySelectorAll('[data-go],[data-spin],[data-halt]').forEach(b => {
  const go = () => quiet(b.dataset.halt ? halt()
    : 'go' in b.dataset ? drive(+b.dataset.go) : spin(+b.dataset.spin));
  b.addEventListener('pointerdown', e => { e.preventDefault(); b.setPointerCapture(e.pointerId); go(); });
  b.addEventListener('pointerup', () => { if (!b.dataset.halt) quiet(halt()); });
  b.addEventListener('pointercancel', () => { if (!b.dataset.halt) quiet(halt()); });
});

const keys = { w: () => drive(0), s: () => drive(180), a: () => drive(-90), d: () => drive(90),
               q: () => spin(-1), e: () => spin(1), ' ': halt };
let held = null;
addEventListener('keydown', ev => {
  if (ev.target.matches('input, select, textarea')) return;
  const k = ev.key.toLowerCase();
  if (!keys[k] || held === k || !body.classList.contains('live')) return;
  held = k; ev.preventDefault(); quiet(keys[k]());
});
addEventListener('keyup', ev => {
  if (held !== ev.key.toLowerCase()) return;
  held = null;
  if (ev.key !== ' ') quiet(halt());
});
addEventListener('blur', () => { if (held) { held = null; quiet(halt()); } });

if (location.protocol === 'https:') $('alert').classList.add('show');
</script>
</html>
